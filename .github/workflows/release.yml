# Desktops release pipeline.
#
# Build: static Qt (vcpkg manifest, baseline pinned in vcpkg.json) on
# windows-latest. First run compiles qtbase (~1.5 h); later runs restore it
# from the vcpkg binary cache.
#
# The binary cache is a NuGet feed on GitHub Packages, not actions/cache:
# actions/cache scopes an entry to the ref that created it, and a cache
# written by tag v0.1.3 is invisible to v0.1.4 (GitHub's documented tag
# isolation), so every release rebuilt from scratch. GitHub Packages has no
# ref scope, no 7-day eviction and no per-repo quota of its own.
#
# LGPLv3 compliance for the statically linked single exe: the source is this
# public repository (relink/rebuild obligation satisfied), and the release
# ships THIRD-PARTY-NOTICES.txt aggregated from every vcpkg dependency's
# copyright file (the exe embeds all of them, not just Qt).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    # Pinned, not windows-latest: vcpkg's ABI hash covers the compiler, so
    # a runner image upgrade would rebuild every package even with a warm
    # binary cache. windows-2025 is what windows-latest resolves to today.
    runs-on: windows-2025
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg.exe
      FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite

    steps:
      - name: Checkout Desktops
        uses: actions/checkout@v4

      - name: Checkout vcpkg at the pinned baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 3723ec118c8354290925feb58d021a9205a3e772
          path: vcpkg

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.bat

      # Credentials for the feed: GITHUB_TOKEN gets them from the
      # `packages: write` permission above. nuget.exe is vcpkg's own copy.
      - name: Add GitHub Packages as a NuGet source
        shell: pwsh
        env:
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_USER: ${{ github.repository_owner }}
        run: |
          $nuget = & "$env:VCPKG_EXE" fetch nuget | Select-Object -Last 1
          & $nuget sources add `
            -Source "$env:FEED_URL" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "$env:NUGET_USER" `
            -Password "$env:NUGET_TOKEN"
          & $nuget setapikey "$env:NUGET_TOKEN" -Source "$env:FEED_URL"

      - name: Configure
        # No pinned generator: the runner image decides which Visual Studio
        # is present (CMake auto-detects the newest). The local `static`
        # preset pins VS 17 2022 and only works on machines that have it.
        # VCPKG_INSTALLED_DIR pins where the manifest install lands so later
        # steps can find it deterministically.
        run: >
          cmake -S . -B build-static
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE/vcpkg_installed"

      - name: Build
        run: cmake --build build-static --config Release --target Desktops

      - name: Aggregate third-party notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          $notices = "stage/THIRD-PARTY-NOTICES.txt"
          $share = "vcpkg_installed/x64-windows-static/share"
          if (-not (Test-Path $share)) {
            Write-Error "vcpkg install output not found at $share"
            exit 1
          }
          Get-ChildItem $share -Directory |
            ForEach-Object {
              $copyright = Join-Path $_.FullName "copyright"
              if (Test-Path $copyright) {
                Add-Content $notices "`n==== $($_.Name) ====`n"
                Get-Content $copyright | Add-Content $notices
              }
            }

      - name: Stage release artifacts
        shell: pwsh
        run: |
          Copy-Item "build-static/Release/Desktops.exe" stage/
          @"
          Desktops - Windows desktops.
          Contains Qt 6 (LGPLv3) and other vcpkg dependencies; see
          THIRD-PARTY-NOTICES.txt. Source and build instructions: this repository
          (cmake --preset static; cmake --build build-static --config Release).
          "@ | Set-Content stage/README.txt

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $changelogPath = "CHANGELOG.md"
          
          if (Test-Path $changelogPath) {
            $changelog = Get-Content $changelogPath -Raw
            
            # Try to find the version section. (?s) is load-bearing: without
            # it `.` stops at the first newline and the section never matches.
            $pattern = "(?s)## \[$version\].*?(?=## \[|$)"
            if ($changelog -match $pattern) {
              $releaseNotes = $matches[0].Trim()
              $releaseNotes | Set-Content -Path "stage/RELEASE_NOTES.md" -Encoding UTF8
              Write-Output "Extracted release notes for version $version"
            } else {
              Write-Output "No specific release notes found for version $version, using default"
              "Release version $version" | Set-Content -Path "stage/RELEASE_NOTES.md" -Encoding UTF8
            }
          } else {
            Write-Output "CHANGELOG.md not found, using default release notes"
            "Release version $version" | Set-Content -Path "stage/RELEASE_NOTES.md" -Encoding UTF8
          }

      - name: Create release
        # workflow_dispatch has no tag: without this a manual run on main
        # creates a release named after the branch.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseNotes = if (Test-Path "stage/RELEASE_NOTES.md") { 
            Get-Content "stage/RELEASE_NOTES.md" -Raw 
          } else { 
            "Single-exe build (static Qt). Source: this repository." 
          }
          
          gh release create "$env:GITHUB_REF_NAME" --title "Desktops $env:GITHUB_REF_NAME" `
            --notes "$releaseNotes" `
            stage/Desktops.exe stage/THIRD-PARTY-NOTICES.txt stage/README.txt
